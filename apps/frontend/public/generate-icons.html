<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  const r = size * 0.18;
  
  // Background
  ctx.fillStyle = '#1A1A8C';
  roundRect(ctx, 0, 0, size, size, r);
  ctx.fill();
  
  // H letter in green
  ctx.fillStyle = '#6DC82A';
  ctx.font = `bold ${size * 0.55}px system-ui`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('H', size/2, size/2);
  
  // Small 'vE' below
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = `bold ${size * 0.18}px system-ui`;
  ctx.fillText('vE', size/2, size * 0.78);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

drawIcon(document.getElementById('c192'), 192);
drawIcon(document.getElementById('c512'), 512);

// Download links
['c192', 'c512'].forEach(id => {
  const a = document.createElement('a');
  a.href = document.getElementById(id).toDataURL('image/png');
  a.download = id === 'c192' ? 'pwa-192x192.png' : 'pwa-512x512.png';
  a.textContent = 'Download ' + a.download;
  document.body.appendChild(a);
  document.body.appendChild(document.createElement('br'));
});
</script>
</body>
</html>
